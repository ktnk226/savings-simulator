<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貯金シミュレーター</title>
<style>
:root { color-scheme: light dark; --foreground: CanvasText; --border: light-dark(#d3dce0,#526068); --viz-series-1: light-dark(#007960,#53deb6); }
body { margin: auto; max-width: 42rem; padding: 2rem 1rem; font: 1rem/1.6 system-ui, sans-serif; }
h3 { font-size: 1.55rem; margin-block: 0 1rem; }
.viz-controls { display: grid; grid-template-columns: repeat(auto-fit,minmax(9rem,1fr)); gap: .75rem; }
label { display: grid; gap: .25rem; }
input, select { box-sizing: border-box; width: 100%; padding: .55rem; font: inherit; }
table { border-collapse: collapse; width: 100%; margin-block: 1rem; }
th, td { padding: .25rem .5rem; border-bottom: 1px solid var(--border); text-align: left; }
th:last-child, td:last-child { text-align: right; }
output { font-weight: 650; }
</style>
<body>
<main>
<p>毎日同じ額を貯金する場合の試算です。1か月は30日、1年は365日とし、利息は含めません。</p>
<section id="boss-savings">
  <h3>貯金のシミュレーター</h3>
  <div class="viz-controls">
    <label class="form-label">今の貯金（円）<input class="form-control" type="number" min="0" max="1000000000" step="1" value="100000"></label>
    <label class="form-label">1日の貯金（円）<input class="form-control" type="number" min="0" max="1000000000" step="1" value="1000"></label>
    <label>期間<input type="number" min="1" max="50" step="1" value="5"></label>
    <label>期間の単位<select><option value="years">年</option><option value="months">か月</option></select></label>
  </div>
  <p aria-live="polite" class="tabular-nums"><output></output></p>
  <p role="alert" class="text-destructive" hidden>金額は0〜10億円、期間は1〜50の整数を入力してください。</p>
  <table aria-label="期間別の貯金残高">
    <thead><tr><th scope="col">期間</th><th scope="col">貯金残高</th></tr></thead>
    <tbody></tbody>
  </table>
  <svg role="img" style="display:block;width:100%;height:200px"></svg>
</section>
<script>
(() => {
  const root = document.getElementById('boss-savings');
  const inputs = Array.from(root.querySelectorAll('input'));
  const unit = root.querySelector('select');
  const table = root.querySelector('table');
  const rows = table.tBodies[0];
  const milestones = [['1か月後', 30], ['3か月後', 90], ['6か月後', 180], ['1年後', 365], ['3年後', 1095], ['5年後', 1825]];
  const chart = root.querySelector('svg');
  const output = root.querySelector('output');
  const alert = root.querySelector('[role=alert]');
  const number = new Intl.NumberFormat('ja-JP');
  const compact = new Intl.NumberFormat('ja-JP', {notation:'compact',maximumFractionDigits:1});
  function draw() {
    const [initial, daily, duration] = inputs.map(input => input.valueAsNumber);
    const valid = inputs.every(input => input.value !== '' && input.validity.valid);
    alert.hidden = valid;
    table.hidden = !valid;
    chart.style.display = valid ? 'block' : 'none';
    if (!valid) { output.textContent = ''; return; }
    const inYears = unit.value === 'years';
    const period = duration + (inYears ? '年' : 'か月');
    const balance = days => initial + daily * days;
    const total = balance(duration * (inYears ? 365 : 30));
    rows.innerHTML = milestones.map(([label, days]) =>
      '<tr><th scope="row">' + label + '</th><td>' + number.format(balance(days)) + '円</td></tr>'
    ).join('');
    output.textContent = period + '後の貯金 ' + number.format(total) + '円（積立で +' + number.format(total-initial) + '円）';
    const width = chart.clientWidth;
    if (width < 100) return;
    const left = 72, right = width - 16, top = 22, bottom = 156;
    const ceiling = Math.max(total, 1);
    const y = value => bottom - (bottom-top)*value/ceiling;
    chart.setAttribute('viewBox', '0 0 '+width+' 200');
    chart.setAttribute('aria-label', '開始時の'+number.format(initial)+'円から'+period+'後の'+number.format(total)+'円までの推移');
    const ticks = (total === 0 ? [0] : [0, Math.round(total/2), total].filter((v,i,a)=>a.indexOf(v)===i));
    chart.innerHTML = `
      <rect data-chart-frame x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="none" stroke="var(--border)"/>
      <g fill="var(--foreground)" font-size="12">
        <text class="axis-title" data-axis="y" x="${left}" y="13">貯金残高（円）</text>
        ${ticks.map(value=>`<line x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}" stroke="var(--border)"/><text x="${left-7}" y="${y(value)+4}" text-anchor="end">${compact.format(value)}</text>`).join('')}
        <text x="${left}" y="174">開始</text>
        <text x="${right}" y="174" text-anchor="end">${period}</text>
        <text class="axis-title" data-axis="x" x="${(left+right)/2}" y="195" text-anchor="middle">経過期間</text>
      </g>
      <path d="M ${left} ${y(initial)} L ${right} ${y(total)}" fill="none" stroke="var(--viz-series-1)" stroke-width="3"/>
    `;
  }
  root.addEventListener('input', draw);
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
</main>
</body>
</html>
